[workspace]
resolver = "2"
members = ["gore-core", "gore-godot"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

# The hit raycast skins the body on the CPU; keep our own crates fast in dev builds too.
[profile.dev.package.gore-core]
opt-level = 2

[profile.dev.package.gore-godot]
opt-level = 2
